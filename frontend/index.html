<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FF5C38" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klam — Auto Captions</title>
    <script>
      // Set the theme before first paint so a dark-mode visitor never sees a
      // flash of light. Light is the default and needs no attribute, but it is
      // written explicitly so the state is never ambiguous. The storage key is
      // duplicated from src/lib/theme.ts: this has to run before any module.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('klam-theme') === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
